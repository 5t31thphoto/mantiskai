[env:m5stack-core2]
; Every version is pinned. Unpinned versions let the build pull different
; toolchain/library code each time, so identical source can stop booting.
platform = espressif32 @ 6.9.0
board = m5stack-core2
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = default_16MB.csv
lib_deps =
    m5stack/M5GFX @ 0.1.17
    m5stack/M5Unified @ 0.1.17
    bblanchon/ArduinoJson @ 7.2.1
